name: Trusted application policy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-ert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out parent-owned application policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host Emacs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emacs-nox
      - name: Check byte compilation without warnings
        run: |
          emacs -Q --batch -L lisp --eval '(setq byte-compile-error-on-warn t)' \
            -f batch-byte-compile lisp/emacsos-app.el lisp/emacsos-counter.el
      - name: Exercise policy on host Emacs
        run: |
          emacs -Q --batch -L lisp -l tests/emacsos-app-tests.el \
            -f ert-run-tests-batch-and-exit
