name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang emacs-nox openssl
      - name: Run file, Lisp, tooling and web server checks
        run: make test

  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pinned runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install the emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Run kernel probes
        run: make test-probes
      - name: Build and accept the actual guest
        run: make test-guest
      - name: Accept persistent files across guest launches
        run: make test-storage
      - name: Print source and image acceptance identity
        if: always()
        run: |
          for record in build/kernel/probe-manifest.json build/image/manifest.json build/image/guest-results.json build/image/storage/results.json; do
            if test -f "$record"; then cat "$record"; fi
          done
