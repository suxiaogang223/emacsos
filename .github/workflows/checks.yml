name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install host test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssl
      - name: Run tooling and web server checks
        run: make test

  guest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the pinned runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install the emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 e2fsprogs openssl
      - name: Build and accept the actual guest
        run: make test-guest
      - name: Install browser test driver
        run: |
          npm install --prefix build/web-browser-tools --no-save --package-lock=false playwright@1.56.1
          build/web-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Accept the actual browser guest
        run: |
          make web-assets
          python3 scripts/serve-web.py > build/web-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18082/ >/dev/null; then break; fi
            sleep 1
          done
          EMACSOS_PLAYWRIGHT="$PWD/build/web-browser-tools/node_modules/playwright" node tests/web/site.cjs
          make test-browser
      - name: Print source and image acceptance identity
        if: always()
        run: |
          for record in build/machine/manifest.json build/machine/acceptance.json build/web-browser/report.json; do
            if test -f "$record"; then cat "$record"; fi
          done
