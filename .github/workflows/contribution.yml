name: Contribution conventions

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the proposed change
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Check project language and pull request format
        env:
          CONTRIBUTION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CONTRIBUTION_EVENT: ${{ github.event_name }}
        run: |
          args=(--require-clean-submodule)
          if [[ "$CONTRIBUTION_EVENT" == "pull_request" ]]; then
            args+=(--base "$CONTRIBUTION_BASE" --event "$GITHUB_EVENT_PATH")
          elif [[ -n "$CONTRIBUTION_BASE" && "$CONTRIBUTION_BASE" != "0000000000000000000000000000000000000000" ]] &&
               git cat-file -e "$CONTRIBUTION_BASE^{commit}" 2>/dev/null &&
               git merge-base --is-ancestor "$CONTRIBUTION_BASE" HEAD; then
            args+=(--base "$CONTRIBUTION_BASE")
          fi
          python3 scripts/check-contribution.py "${args[@]}"
      - name: Test contribution checks
        run: python3 -m unittest discover -s scripts/tests -p 'test_contribution.py'
