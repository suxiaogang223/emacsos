name: Volatile file backend

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  file-pal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exercise file PAL and Linux descriptor adapter with sanitizers
        run: python3 scripts/check-files.py
