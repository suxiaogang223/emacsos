name: Fixed-machine MVP acceptance

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guest-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the pinned runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install the emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Build and accept the actual guest
        run: make check-mvp
      - name: Print source and image acceptance identity
        if: always()
        run: |
          for record in build/mvp/manifest.json build/mvp/acceptance.json; do
            if test -f "$record"; then cat "$record"; fi
          done
